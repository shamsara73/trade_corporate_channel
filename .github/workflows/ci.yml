name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ./mvnw verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml
      - run: ./mvnw -B verify
        working-directory: app

  integration:
    name: ./mvnw verify -Pintegration
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: app/pom.xml
      - run: ./mvnw -B verify -Pintegration
        working-directory: app

  docs:
    name: Generated documents are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml==5.3.0
      - run: |
          python3 -I tools/specgen/build.py
          python3 -I tools/mappingdoc/build_outbound.py
          python3 -I tools/mappingdoc/build_eventfields.py
          python3 -I tools/dbspec/build_db_crosswalk.py
          python3 -I tools/xsdcheck/build_xsd_report.py  # also re-validates every sample against the XSD jar
          git diff --exit-code -- docs

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
