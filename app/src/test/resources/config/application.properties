# Test settings: invented data only (ground rule 9), no SQL Server, no MQ, never a real TI (ground rule 6).
spring.datasource.url=jdbc:h2:mem:tcc;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.security.user.password=test-only
channel.customer.mnemonic=0009990001
channel.customer.name=POC TEST CUSTOMER
channel.customer.behalf-of-branch=001
channel.gateway.mode=file
channel.gateway.file-directory=target/test-sent-messages
channel.gateway.inbox-directory=target/test-ti-inbox
channel.gateway.target-system=ZONE1
channel.gateway.source-system=TRADECHANNEL
channel.gateway.ti-user=CHANNEL_SVC
channel.gateway.mq.host=localhost
channel.gateway.mq.port=1414
channel.gateway.mq.channel=DEV.APP.SVRCONN
channel.gateway.mq.queue-manager=QM1
channel.gateway.mq.user=app
channel.gateway.mq.password=
channel.gateway.mq.send-queue=TI.IN
channel.gateway.mq.reply-queue=TI.OUT
channel.gateway.simulator.enabled=false
# Tests drive the dispatcher and the inbox themselves.
channel.jobs.enabled=false
