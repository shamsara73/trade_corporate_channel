spring:
  application:
    name: tcc
  messages:
    basename: messages
  datasource:
    # SQL Server. Run with the h2 profile to try the app without a database server.
    url: ${CHANNEL_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=tcc;encrypt=true;trustServerCertificate=true}
    username: ${CHANNEL_DB_USER:tcc}
    password: ${CHANNEL_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  thymeleaf:
    cache: true
  security:
    user:
      # Sign in as "demo". The password is CHANNEL_DEMO_PASSWORD, or generated and printed at start-up.
      name: demo
      password: ${CHANNEL_DEMO_PASSWORD:123456}
server:
  port: 8880
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: true
  error:
    include-stacktrace: never
    whitelabel:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
channel:
  web:
    environment-label: ""
  customer:
    # The corporate this proof of concept acts for. Real values come from the environment
    # (CHANNEL_CUSTOMER_MNEMONIC, ...); these are invented.
    mnemonic: "0003350921"
    name: EKAMAS FORTUNA
    behalf-of-branch: "906"
  finance:
    currencies: [USD, EUR, SGD, IDR, MYR]
    product-types: [PSF]
    default-tenor-days: 60
  gateway:
    mode: mq
    file-directory: ./sent-messages
    # file mode: TI's replies and outward messages are read from here (then moved to processed/).
    inbox-directory: ./ti-inbox
    target-system: ZONE1
    source-system: TCC
    ti-user: SUPERVISOR
    mq:
      host: 10.230.81.51
      port: 2414
      channel: INTEGRATORCHNL
      queue-manager: MBI.QUEUE.MGR
      user: mqm
      password: "P@ssw0rd"
      send-queue: TI.GWY.IN.1
      reply-queue: TI.GWY.OUT.1
      # Where TI puts its outward messages (TFFINACK ...); empty = the reply queue.
      outward-queue: ""
    simulator:
      # file mode only: answer every message like TI (never in production).
      enabled: false
      complete-after: 10s
  jobs:
    # The outbox dispatcher and the inbox readers.
    enabled: true
    poll-millis: 2000
